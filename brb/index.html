<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LevelUp Sports | Be Right Back</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{background:#071421;color:#f5f9ff;font-family:"Segoe UI",Arial,sans-serif;overflow:hidden}
main{height:100%;display:grid;place-items:center;position:relative;isolation:isolate;padding:5%;background:
radial-gradient(ellipse at 9% 10%,#174d72 0,transparent 45%),
radial-gradient(ellipse at 94% 96%,#234a3b 0,transparent 48%),
linear-gradient(135deg,#0b2137,#071421 69%)}
main::before{content:"";position:absolute;inset:4%;z-index:-1;border:1px solid #70b6d450;border-radius:2vw}
main::after{content:"";position:absolute;left:7%;right:7%;top:4%;height:.45vh;background:linear-gradient(90deg,#56b3ff,#c0eb76 53%,#ff9d47);border-radius:1vw}
section{text-align:center;width:100%;max-width:1240px}
.brand{display:flex;flex-direction:column;align-items:center;gap:1.5vh;margin-bottom:5vh}
.brand img{width:min(32vw,48vh,520px);height:auto;max-height:20vh;object-fit:contain}
.brand span{font-size:clamp(11px,1.35vw,26px);font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:#d8e6f8}
.status{display:inline-flex;align-items:center;gap:.65em;padding:.55em 1.05em;border:1px solid #ffb56675;background:#3a2618;border-radius:99px;color:#ffd0a3;font-size:clamp(11px,min(1.45vw,2.5vh),28px);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.status::before{content:"";width:.55em;height:.55em;border-radius:50%;background:#ffab59}
h1{margin:2.3vh 0 1.8vh;font-size:clamp(26px,min(6.5vw,12vh),118px);line-height:1;letter-spacing:-.045em}
p{margin:0 auto;font-size:clamp(13px,min(2.15vw,3.8vh),40px);line-height:1.45;color:#d0e0f3;max-width:48ch}
</style>
</head>
<body>
<main><section aria-labelledby="message">
<div class="brand"><img src="../g/assets/logo.png" alt="" onerror="this.hidden=true"><span>LevelUp Sports &amp; Athletics Club</span></div>
<div class="status">Technical difficulties</div>
<h1 id="message">We’ll be right back</h1>
<p>We’re working to restore the live stream. Thanks for your patience.</p>
</section></main>
</body>
</html>
