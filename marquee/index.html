<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LevelUp Sports | Ad Marquee</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Segoe UI",Arial,sans-serif;color:#fff}
.ticker{position:absolute;inset:auto 2.2% 1.1%;height:4.35%;display:flex;align-items:center;overflow:hidden;border:1px solid #ff9d45;border-radius:.5vw;background:linear-gradient(95deg,#102f7b,#0a1b45 72%,#153e21);box-shadow:0 2px 10px #050a22a0}
.track{flex:none;display:flex;width:max-content;animation:crawl 24s linear infinite;will-change:transform}
.copy{flex:none;padding-right:2.8em;font-size:clamp(10px,1.24vw,26px);font-weight:720;letter-spacing:.055em;white-space:nowrap}
.dot{color:#ffab50;margin:0 .9em}
@keyframes crawl{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
</style>
</head>
<body>
<div class="ticker" id="ticker"><div class="track" id="track"></div></div>
<template id="copy"><span class="copy">BOOK YOUR COURT AT LEVELUPSPORTS.US <span class="dot">◆</span> JOIN US FOR INDOOR CRICKET <span class="dot">◆</span> YOUR BUSINESS HERE — ASK THE FRONT DESK ABOUT SPONSORSHIPS <span class="dot">◆</span></span></template>
<script>
'use strict';
const track = document.getElementById('track');
const copy = document.getElementById('copy').content.firstElementChild;
function fill() {
  track.replaceChildren(copy.cloneNode(true));
  const width = track.firstElementChild.getBoundingClientRect().width;
  const n = Math.max(1, Math.ceil(track.parentElement.clientWidth / (width || 1)));
  for (let i=1;i<2*n;i++) {
    const item = copy.cloneNode(true);
    item.setAttribute('aria-hidden','true');
    track.append(item);
  }
  track.style.animationDuration = Math.max(14, width*n/105) + 's';
}
fill();
window.addEventListener('resize', fill);
</script>
</body>
</html>
