<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LevelUp Sports | Subscribe CTA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Segoe UI",Arial,sans-serif;color:#fff}
.cta{position:absolute;top:3%;right:2.5%;display:flex;align-items:center;gap:.8em;padding:.6em;background:linear-gradient(125deg,#183b7f,#09162e 70%,#123124);border:1px solid #ff9d45;border-radius:.8em;box-shadow:0 .22em .7em #0008;text-decoration:none;color:inherit;font-size:clamp(12px,1.05vw,21px)}
.cta:focus-visible{outline:3px solid #90dd45;outline-offset:3px}
.copy{display:grid;gap:.36em}
.badge{justify-self:start;background:#c51627;border-radius:.4em;padding:.42em .72em;font-weight:850;letter-spacing:.045em}
.handle{font-size:.81em;font-weight:650;color:#e4efff}
.hint{font-size:.72em;color:#fbdab4}
.qr{width:clamp(78px,6.25vw,120px);height:auto;display:block;border-radius:.2em;image-rendering:pixelated}
</style>
</head>
<body>
<a class="cta" href="https://www.youtube.com/@LevelUpSportsAthleticsClub" target="_blank" rel="noopener noreferrer" aria-label="Subscribe to LevelUp Sports and Athletics Club on YouTube">
  <span class="copy">
    <span class="badge"><span aria-hidden="true">▶</span> SUBSCRIBE</span>
    <span class="handle">@LevelUpSportsAthleticsClub</span>
    <span class="hint">Scan to open our YouTube channel</span>
  </span>
  <img class="qr" src="./channel-qr.svg" alt="QR code for the LevelUp YouTube channel" width="120" height="120">
</a>
</body>
</html>
