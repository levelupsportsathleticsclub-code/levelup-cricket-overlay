<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LevelUp Cricket Broadcast</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white}
body{font:800 clamp(10px,1.34vw,27px) "Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:root{--orange:#ff962f;--ink:#061438;--cyan:#4cdfff;--green:#90dd45}
.masthead{display:flex;justify-content:center;text-align:center;text-transform:uppercase;margin:0 auto .62em;max-width:86%}
.ribbon{position:relative;isolation:isolate;padding:.45em 1.8em;font-size:1.04em;font-style:italic;letter-spacing:.025em;line-height:1.08;filter:drop-shadow(0 0 .38em #1687fa80)}
.ribbon::before,.ribbon::after{content:"";position:absolute;inset:0;z-index:-1;transform:skewX(-25deg)}
.ribbon::before{background:linear-gradient(115deg,#ffd69f,#bc4c0b 9%,#ffb866 12%,#103b83 15%,#0a235f 80%,#ff790b 89%,#ffd69f);border-block:2px solid var(--orange)}
.ribbon::after{inset:4px 7%;background:linear-gradient(180deg,#104393,#071a4e 58%,#0b1741);border-block:1px solid #53b4f9}
#tag{position:absolute;left:50%;bottom:4.3%;transform:translateX(-50%);padding:.4em .7em;font-size:.72em;line-height:1.2;border:1px solid var(--orange);border-radius:.35em;background:#091d40;color:#fff1db;text-shadow:0 1px #000;white-space:nowrap}
main #tag{bottom:calc(100% + .7em)}
main{position:absolute;inset:auto 2.2% 6.5%}
.wings{position:absolute;z-index:-1;inset:-2em -2.25% -4.5vh;overflow:hidden;pointer-events:none}
.wings::before,.wings::after{content:"";position:absolute;width:30%;height:100%;background:linear-gradient(148deg,#0f9fffbb 0%,#102e77bb 30%,#123c1ecc 65%,#469d1acc 80%,#0b1c27);clip-path:polygon(0 0,100% 100%,0 100%)}
.wings::after{right:0;transform:scaleX(-1);background:linear-gradient(148deg,#75db28cc,#2a771abb 38%,#124923cc 72%,#6fbb2bcc)}
.matchup{min-height:3.7em;display:grid;grid-template-columns:minmax(0,1.28fr) .86fr .67fr .38fr minmax(0,1.37fr);align-items:stretch;position:relative;isolation:isolate;margin:0 1.65em .78em;border-block:2px solid #68dcff;border-radius:.78em;box-shadow:0 0 .65em #189bff91,0 .27em .55em #090b2c; background:linear-gradient(180deg,#144fb4,#08266e 44%,#07163f)}
.team{display:flex;align-items:center;justify-content:center;min-width:0;font-size:1.58em;font-style:italic;text-transform:uppercase;padding:0 .4em;letter-spacing:-.025em}
.team.home{padding-left:1.65em}
.team.away{padding-right:1.65em;border-radius:0 .45em .45em 0;background:linear-gradient(#53a725,#23690e 55%,#10360e);box-shadow:inset 0 2px 0 var(--green)}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crest{position:absolute;top:50%;transform:translateY(-50%);width:3.55em;aspect-ratio:1;background:var(--orange);clip-path:polygon(50% 0,100% 14%,94% 64%,77% 86%,50% 100%,23% 86%,6% 64%,0 14%);display:grid;place-items:center;font:900 1.02em Arial,sans-serif;isolation:isolate;text-shadow:0 .13em .24em #000}
.crest::before{content:"";position:absolute;inset:3px;background:linear-gradient(145deg,#1354a4,#061938 70%);clip-path:inherit;z-index:-1}
.crest::after{content:"✦";position:absolute;bottom:.5em;font-size:.48em;color:var(--orange)}
#homeCrest{left:-.93em}#awayCrest{right:-.93em}#awayCrest::before{background:linear-gradient(145deg,#38861b,#0e310f 72%)}
.scorebox{position:relative;isolation:isolate;display:grid;place-items:center;min-width:0;color:#06143b}
.scorebox::before{content:"";position:absolute;inset:-.18em 1%;background:linear-gradient(#ffcf91,#ffac4c 50%,#f68a20 51%,#e77915);transform:skewX(-20deg);border:2px solid #ffdbb1;border-radius:.55em;z-index:-1;box-shadow:0 0 .45em #ffab5b99}
#score{font-size:2.74em;font-style:italic;font-weight:950;letter-spacing:-.06em;line-height:1}
.overs,.versus{display:grid;place-items:center;font-style:italic;white-space:nowrap}
.overs{font-size:1.16em}
.versus{transform:skewX(-16deg);background:linear-gradient(#4b4762,#202037);border-inline:2px solid #ef9a4b;font-size:1.16em}
.versus span{transform:skewX(16deg)}
.details{display:grid;grid-template-columns:1.17fr .44fr 1.11fr 1.26fr;align-items:stretch;min-height:4em;background:linear-gradient(#102f7b,#091b53 73%,#07153d);border:2px solid #ff9d45;border-radius:.77em;box-shadow:inset 0 2px 0 #96e7ff,0 0 .5em #ff842680}
.cell{min-width:0;display:flex;justify-content:center;flex-direction:column;gap:.19em;padding:.43em .68em;border-right:1px solid #ff9d4599}
.cell:last-child{border-right:0}
.line{display:flex;justify-content:space-between;gap:.35em;text-transform:uppercase;font-style:italic}
.value{color:#ffc27d;white-space:nowrap}
.label{color:#d0e0ff;text-transform:uppercase;font-size:.68em;letter-spacing:.05em}
.rate{align-items:center;line-height:1.02}
#pace{font-size:1.48em;color:#ffc27d;font-style:italic}
#balls{display:flex;flex-wrap:wrap;gap:.19em}
.ball{display:grid;place-items:center;min-width:1.34em;padding:0 .16em;height:1.32em;border-radius:.25em;background:linear-gradient(#2970bc,#153776);border:1px solid #86ccff;font-size:.88em;font-style:italic}
.ball.six{background:linear-gradient(#13a3ff,#0752bb)}.ball.four{background:linear-gradient(#39db46,#137c25);border-color:#acf6ad}.ball.wicket{background:linear-gradient(#db5271,#9b1741);border-color:#ffc0c9}
#event{width:max-content;max-width:92%;margin:0 auto .55em;text-transform:uppercase;padding:.3em 1.5em;background:linear-gradient(100deg,#1527ac,#205b17);color:#fff1db;border:2px solid var(--orange);font-size:1.65em;font-weight:900;font-style:italic;text-align:center;border-radius:.25em}
#event.flash{animation:burst .35s ease-out}
@keyframes burst{from{transform:translateY(.6em) scale(.87);opacity:0}}
@media(prefers-reduced-motion:reduce){#event.flash{animation:none}}
</style>
<div id="tag" hidden></div>
<main id="bar" hidden>
  <div class="wings" aria-hidden="true"></div>
  <div id="event" hidden></div>
  <header class="masthead" id="masthead">
    <div id="competition" class="ribbon">LevelUp Premier Cricket League • Season 1</div>
  </header>
  <div class="matchup">
    <div class="team home"><span id="batting" class="name"></span></div>
    <div class="scorebox"><div id="score"></div></div>
    <div class="overs" id="overs"></div>
    <div class="versus"><span>VS</span></div>
    <div class="team away"><span id="fielding" class="name"></span></div>
    <div class="crest" id="homeCrest" aria-hidden="true"></div>
    <div class="crest" id="awayCrest" aria-hidden="true"></div>
  </div>
  <div class="details">
    <div class="cell"><div id="batter1" class="line"></div><div id="batter2" class="line"></div></div>
    <div class="cell rate"><span id="innings" class="label"></span><span class="label">CRR</span><span id="pace"></span></div>
    <div class="cell"><div class="label">Bowling</div><div id="bowler" class="line"></div></div>
    <div class="cell"><div class="label">This over</div><div id="balls"></div></div>
  </div>
</main>
<script>
'use strict';

const params = new URLSearchParams(location.search);
const demo = params.get('mode') === 'demo' || (!params.has('mode') && !params.has('feed') && !params.has('club') && !params.has('fixture'));
const demoClub = params.get('club') || '1124300';
const demoFixture = params.get('fixture') || '1018';
const clubId = params.get('club');
const fixtureId = params.get('fixture');
const byId = id => document.getElementById(id);
const set = (id, value) => { byId(id).textContent = value; };
byId('masthead').hidden = params.get('header') === '0';
const eventLabels = {four:'Four', six:'Six', wicket:'Wicket', fifty:'Fifty', century:'Century'};
let previous;
let eventTimeout;
let failures = 0;

function line(id, name, value) {
  const label = Object.assign(document.createElement('span'), {className:'name', textContent:name});
  const figures = Object.assign(document.createElement('span'), {className:'value', textContent:value});
  byId(id).replaceChildren(label, figures);
}

function overs(balls) {
  return Math.floor(balls / 6) + '.' + (balls % 6);
}

function labelEvent(event) {
  return typeof event?.id === 'string' && event.id.length > 0 && Object.hasOwn(eventLabels, event.type);
}

function showEvent(snapshot) {
  const banner = byId('event');
  const persistent = snapshot.phase === 'break' ? 'Innings break' :
    snapshot.phase === 'final' ? (snapshot.result || 'Match complete') : '';
  if (persistent && !banner.hidden && banner.textContent === persistent) return;
  if (!persistent && previous?.phase === 'live' && previous.event?.id === snapshot.event?.id) return;
  clearTimeout(eventTimeout);
  const label = persistent || (previous?.phase === 'live' && labelEvent(snapshot.event)
    ? eventLabels[snapshot.event.type] : '');
  banner.textContent = label;
  banner.hidden = !label;
  banner.classList.remove('flash');
  if (label) {
    void banner.offsetWidth;
    banner.classList.add('flash');
    if (!persistent) eventTimeout = setTimeout(() => { banner.hidden = true; }, 2900);
  }
}

function initials(name) {
  const words = name.match(/[\p{L}\p{N}]+/gu) || [];
  return (words.length === 1 ? words[0].slice(0, 3) : words.slice(0, 3).map(word => Array.from(word)[0]).join('')).toUpperCase() || '–';
}

function status(label, state = '') {
  set('tag', label);
  byId('tag').hidden = state !== 'delayed';
}

function render(snapshot) {
  set('competition', snapshot.competition || 'LevelUp Premier Cricket League • Season 1');
  status('');
  set('batting', snapshot.batting);
  set('fielding', snapshot.fielding);
  set('homeCrest', initials(snapshot.batting));
  set('awayCrest', initials(snapshot.fielding));
  set('innings', 'Innings ' + snapshot.innings);
  set('score', snapshot.runs + '/' + snapshot.wickets);
  const crr = snapshot.legalBalls ? (snapshot.runs * 6 / snapshot.legalBalls).toFixed(2) : '0.00';
  set('overs', overs(snapshot.legalBalls) + ' OVERS');
  set('pace', crr);
  byId('balls').replaceChildren(...(snapshot.deliveries || []).slice(-12).map(value => {
    const chip = document.createElement('span');
    chip.className = 'ball' + (value === 'W' ? ' wicket' : value === '4' ? ' four' : value === '6' ? ' six' : '');
    chip.textContent = value;
    return chip;
  }));
  for (let i = 0; i < 2; i++) {
    const player = snapshot.batters?.[i];
    line('batter' + (i + 1), player ? (player.onStrike ? '▸ ' : '') + player.name : '—',
      player ? player.runs + ' (' + player.balls + ')' : '');
  }
  const bowler = snapshot.bowler;
  line('bowler', bowler?.name || '—', bowler ? bowler.wickets + '/' + bowler.runs + ' (' + overs(bowler.legalBalls) + ')' : '');
  const bar = byId('bar');
  bar.prepend(byId('tag'));
  bar.hidden = false;
  showEvent(snapshot);
  previous = snapshot;
}

const count = value => Number.isSafeInteger(value) && value >= 0;
const label = value => typeof value === 'string' && value.trim().length > 0;

function valid(snapshot) {
  return snapshot && String(snapshot.clubId) === clubId && String(snapshot.fixtureId) === fixtureId &&
    ['live','break','final'].includes(snapshot.phase) && label(snapshot.batting) && label(snapshot.fielding) &&
    count(snapshot.innings) && snapshot.innings > 0 && count(snapshot.runs) && count(snapshot.wickets) &&
    count(snapshot.legalBalls) && (!snapshot.deliveries || (Array.isArray(snapshot.deliveries) &&
      snapshot.deliveries.every(value => label(value) && value.length <= 5))) &&
    (!snapshot.batters || (Array.isArray(snapshot.batters) && snapshot.batters.every(player =>
      player && label(player.name) && count(player.runs) && count(player.balls)))) &&
    (!snapshot.bowler || (label(snapshot.bowler.name) && count(snapshot.bowler.runs) &&
      count(snapshot.bowler.wickets) && count(snapshot.bowler.legalBalls)));
}

async function poll(feed) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4500);
  try {
    const response = await fetch(feed, {cache:'no-store', credentials:'omit', signal:controller.signal});
    if (!response.ok) throw new Error('Feed HTTP ' + response.status);
    const snapshot = await response.json();
    if (!valid(snapshot)) throw new Error('Invalid or mismatched snapshot');
    const updated = Date.parse(snapshot.updatedAt);
    if (!Number.isFinite(updated) || updated > Date.now() + 30000 ||
        (snapshot.phase !== 'final' && updated < Date.now() - 120000) ||
        (previous && updated < Date.parse(previous.updatedAt))) throw new Error('Invalid feed timestamp');
    render(snapshot);
    failures = 0;
  } catch (error) {
    failures++;
    status(previous ? 'Feed delayed · last score' : 'Score feed unavailable', 'delayed');
    byId('event').hidden = true;
    console.warn(error.message);
  } finally {
    clearTimeout(timeout);
  }
  setTimeout(() => poll(feed), Math.min(30000, 5000 * 2 ** failures));
}

if (demo && demoClub === '1124300' && demoFixture === '1018') {
  render({competition:'LevelUp Premier Cricket League • Season 1', batting:'Rangers', fielding:'Ruthless XI',
    phase:'live', innings:1, runs:67, wickets:0, legalBalls:17, deliveries:['6','6','4','6','6'],
    batters:[{name:'Sathish Reddy',runs:47,balls:11,onStrike:true},{name:'Praveen K',runs:20,balls:6}],
    bowler:{name:'Chetan Reddy',wickets:0,runs:50,legalBalls:11}});
} else if (demo) {
  status('Preview available for fixture 1018', 'delayed');
} else if (params.has('feed') && /^\d+$/.test(clubId || '') && /^\d+$/.test(fixtureId || '')) {
  try {
    const feed = new URL(params.get('feed'), location.href);
    if (feed.protocol !== 'https:' && !(feed.protocol === 'http:' &&
        ['localhost','127.0.0.1'].includes(feed.hostname))) throw new Error('HTTPS feed required');
    if (feed.username || feed.password) throw new Error('Feed URL must be public');
    feed.searchParams.set('clubId', clubId);
    feed.searchParams.set('fixtureId', fixtureId);
    poll(feed);
  } catch (error) {
    status('Invalid score feed URL', 'delayed');
  }
} else {
  status('Awaiting score feed', 'delayed');
}
</script>
</html>
