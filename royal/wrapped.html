<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LevelUp LPCL | Royal Shield Complete Frame</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
*{box-sizing:border-box}
:root{
  /* Percentages are relative to the full 1920x1080 OBS Browser Source. */
  --bottom:7%;--height:14%;--left-width:12%;--right-width:12%;
  --frame-left:9.6%;--frame-width:80.8%;
  --frame-bottom:7.9%;--frame-height:12.3%;
  --edge-thickness:4px;
  /* SEASON-1 tab: right/bottom/width/height relative to OBS canvas */
  --season-right:10.8%;--season-bottom:20.4%;
  --season-width:10%;--season-height:3.7%;--season-font:1.45vw;
}
.frame{
 position:absolute;left:var(--frame-left);width:var(--frame-width);
 bottom:var(--frame-bottom);height:var(--frame-height);
 z-index:2;pointer-events:none;background:transparent;
 border-top:var(--edge-thickness) solid #ffda75;
 border-bottom:var(--edge-thickness) solid #c88a26;
 border-radius:12px;
 box-shadow:0 -2px 0 #113e87 inset,0 2px 0 #08306d inset,
 0 -1px 0 rgba(7,23,55,.9),0 2px 5px rgba(0,0,0,.38);
}
/* Inset cobalt line adds the continuous royal-blue metallic finish.
   The CricClubs scorebar and all its text remain transparent/visible. */
.frame::before{
 content:"";position:absolute;inset:2px 2px 2px 2px;
 border-top:3px solid #123b82;border-bottom:3px solid #123b82;
 border-radius:8px;pointer-events:none;
}
.frame::after{
 content:"";position:absolute;left:1%;right:1%;top:-3px;height:2px;
 background:linear-gradient(90deg,transparent,#fff0b5 16%,#c58b2c 30%,#fff3c0 50%,#c58b2c 70%,#fff0b5 84%,transparent);
 pointer-events:none;
}
.wing{position:absolute;bottom:var(--bottom);height:var(--height);display:block;object-fit:contain;z-index:3;pointer-events:none}
.left{left:0;width:var(--left-width);object-position:right center}
.right{right:0;width:var(--right-width);object-position:left center}
.season-tab{
 position:absolute;right:var(--season-right);bottom:var(--season-bottom);
 width:var(--season-width);height:var(--season-height);z-index:8;
 display:flex;align-items:center;justify-content:center;
 padding:0 .4vw;overflow:hidden;white-space:nowrap;pointer-events:none;
 color:#fff6d7;font:900 var(--season-font)/1.1 Arial,Helvetica,sans-serif;
 letter-spacing:.035em;text-shadow:0 1px 2px #061b3c;
 background:linear-gradient(180deg,#193f7c 0%,#0a2351 50%,#061734 100%);
 border:2px solid #e7b956;border-bottom:3px solid #b57923;
 border-radius:13px 13px 5px 5px;
 box-shadow:0 2px 5px #0008,inset 0 1px 1px #fff4;
}
.season-tab[hidden]{display:none}
</style>
<script>
/* Example: ?v=frame2&x=9.6&w=80.8&y=7.9&fh=12.3
   x = left frame edge; w = frame width; y = bottom; fh = height.
   b/h adjust both original wings together; l/r adjust each wing width.
*/
const q=new URLSearchParams(location.search);
for(const [key,css,min,max] of [
 ['x','--frame-left',0,40],['w','--frame-width',35,100],
 ['y','--frame-bottom',0,40],['fh','--frame-height',4,30],
 ['b','--bottom',0,35],['h','--height',5,28],
 ['l','--left-width',5,30],['r','--right-width',5,30],
 ['sx','--season-right',0,45],['sy','--season-bottom',0,45],
 ['sw','--season-width',3,30],['sh','--season-height',1,14]
]){
 if(!q.has(key))continue;
 const v=Number(q.get(key));
 if(Number.isFinite(v)&&v>=min&&v<=max)document.documentElement.style.setProperty(css,v+'%');
}
const font=Number(q.get('sf'));if(q.has('sf')&&Number.isFinite(font)&&font>=0.4&&font<=4)document.documentElement.style.setProperty('--season-font',font+'vw');
window.addEventListener('DOMContentLoaded',()=>{
 const badge=document.getElementById('season-badge');
 if(q.get('showseason')==='0')badge.hidden=true;
 const value=q.get('season');
 if(value!==null)badge.textContent=(value.trim().slice(0,36)||'SEASON-1');
});
</script>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<div id="season-badge" class="season-tab">SEASON-1</div>
<img class="wing left" src="./royal-shield-left.png" alt="">
<img class="wing right" src="./royal-shield-right.png" alt="">
</body>
</html>
