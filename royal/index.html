<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPCL | Royal Shield OBS Wings</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
:root{--left-edge:9.7%;--right-edge:90.65%;--bottom:7%;--height:14%}
.wing{position:absolute;bottom:var(--bottom);height:var(--height);display:block;object-fit:contain}
.left{object-position:right center}
.right{object-position:left center}
.left{left:0;width:var(--left-edge)}
.right{left:var(--right-edge);right:0;width:calc(100% - var(--right-edge))}
</style>
<script>
const p=new URLSearchParams(location.search);
for(const [key,property,min,max] of [['l','--left-edge',2,27],['r','--right-edge',73,98],['b','--bottom',0,35],['h','--height',5,24]]){
  if(!p.has(key)||p.get(key).trim()==='')continue;
  const n=Number(p.get(key));if(Number.isFinite(n)&&n>=min&&n<=max)document.documentElement.style.setProperty(property,n+'%');
}
</script></head><body>
<img class="wing left" src="royal-shield-left.png" alt="LPCL Royal Shield">
<img class="wing right" src="royal-shield-right.png" alt="Royal Shield cricket ball">
</body></html>
